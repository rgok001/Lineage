# Render Blueprint: the trace worker's permanent home.
#
# One background worker, one persistent disk. The worker polls trace_requests
# for owner-approved jobs and runs the pipeline (see worker/run.py); the disk
# holds DATA_DIR (fetched papers, extracted text, exports), which must outlive
# restarts. It held an embedding-model cache until embeddings moved to Voyage.
#
# Secrets are sync:false — Render asks for them in the dashboard on first
# deploy; they are never committed. All four are required:
#   DATABASE_URL       Neon DIRECT (unpooled) connection string. The pooled
#                      endpoint is for the serverless app; this worker holds
#                      one long-lived connection.
#   ANTHROPIC_API_KEY  pays for stages B, C (labels), D, F, G and H. It appears
#                      in no env() call because the Anthropic SDK reads it from
#                      the environment itself; it is required all the same.
#   VOYAGE_API_KEY     embeddings for Stage A's relevance filter and Stage C's
#                      clustering. Omitted from this list until 2026-08-02, and
#                      a worker without it boots healthy and then fails every
#                      trace on its first embedding call.
#   OPENALEX_MAILTO    contact email for the OpenAlex polite pool

services:
  - type: worker
    name: lineage-worker
    runtime: python
    # 'standard' = 2 GB RAM / 1 CPU. This was needed when embeddings ran on a
    # local model (bge-large peaked >2 GB at load and OOM-killed 'starter').
    # Embeddings are now the Voyage hosted API (no model in memory), so the
    # worker's footprint is ~250 MB and 'starter' (512 MB) would suffice —
    # downgrade to save cost once a Voyage run is confirmed. Kept at 'standard'
    # for now for safety. For a blueprint service this line is authoritative.
    plan: standard
    # Decision 31 (issue #102): deployments are fully automatic, migrations
    # included. autoDeploy makes every push to master a worker deploy;
    # preDeployCommand applies pending migrations before the new worker code
    # that expects them starts. migrate.py is idempotent over the applied set
    # (schema_migrations) and DATABASE_URL here is the direct endpoint
    # migrations require. If the pre-deploy fails, Render aborts the deploy and
    # the old worker keeps running — a broken migration stops the release, it
    # does not half-apply it.
    autoDeploy: true
    preDeployCommand: python pipeline/db/migrate.py
    buildCommand: pip install -r pipeline/requirements.txt
    # -u for the same reason the worker passes -u to every stage it spawns: with
    # stdout on a pipe rather than a terminal, Python buffers by the kilobyte, so
    # a quiet worker's own prints reach the log long after the thing they
    # describe. It had -u for its children and not for itself, which is why the
    # startup report was invisible on the deploy that introduced it.
    startCommand: python -u worker/run.py
    disk:
      name: lineage-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATA_DIR
        value: /data
      - key: PROMPT_VERSION
        value: v2
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: VOYAGE_MODEL
        value: voyage-3
      - key: TRACE_SPEND_CAP_USD
        value: "15"
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
